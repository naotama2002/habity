# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

# 更新をグループ化して 1 PR にまとめる方針。
# 個別 PR が並ぶと同じ pnpm-lock.yaml を取り合って毎回コンフリクトするため。
#
# npm: major は影響範囲が読めない (Expo SDK のメジャー更新など) ので
#      グループから外し、従来どおり単独 PR で出す。
#      また Expo SDK が管理するパッケージは ignore する (下記)。
# github-actions: major bump (actions/checkout v4 -> v7 など) が常態で、
#      lockfile も触らないため major も含めてまとめる。

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # サプライチェーン対策: 公開直後のバージョンを採用しない。
    # Dependabot は設定しなくても既定で 3 日のクールダウンを適用するが、
    # .npmrc の minimum-release-age と揃えて 7 日にし、方針を明示する。
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Expo SDK が検証した組み合わせを壊さないため、SDK 管理下の
    # パッケージは Dependabot の対象から外す。
    # これらは週次の expo-sdk-sync ワークフロー (expo install --fix) が
    # まとめて更新する。
    #
    # 放置した結果、ズレが両方向に出ていた:
    #   - Dependabot は expo-* を上げないため SDK より古くなる
    #   - 一方 react-native などは SDK より先行して上がる
    # 実際 react-native 0.88 を取り込んだ際、jest-expo が追従できず
    # 全 44 suite が起動不能になった (#94)。
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "jest-expo"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      # TypeScript の major は typescript-eslint が追従するまで保留する。
      # TS 7 を入れると ts-api-utils が TS 7 の内部 API 変更で落ち、
      # @typescript-eslint プラグインのロード自体が失敗して lint が動かない
      # (typecheck / test / ビルドは TS 7 でも通る)。
      #
      #   TypeError: Failed to load plugin "@typescript-eslint":
      #     Cannot read properties of undefined (reading "Intrinsic")
      #
      # typescript-eslint は latest も canary も peer が
      # "typescript: >=4.8.4 <6.1.0" で、TS 7 を受け付けるリリースがまだ無い。
      #
      # なお lint を oxlint / Biome に移行すればこの制約は消える
      # (どちらも Rust 実装で typescript パッケージに依存しない)。
      # 移行した場合はこの ignore を外すこと。
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
